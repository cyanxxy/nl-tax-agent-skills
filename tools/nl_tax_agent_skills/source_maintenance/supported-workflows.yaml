terminal_workflows:
  - id: manual_review
    status: terminal_manual_review
    may_prepare_workpack: false
    profile_candidates:
      - manual_review
    case_scope: complex_case_manual_review
    allowed_output: conversation_only
    reason: >-
      Intake detected facts that should not enter an annual/provisional
      workpack automatically, such as complex Box 2 valuation, restructuring,
      treaty/nonresident, death, emigration, informal-capital, non-arm's-length,
      or corporate-tax-heavy DGA questions.

  - id: unsupported
    status: terminal_unsupported
    may_prepare_workpack: false
    profile_candidates:
      - unsupported
    case_scope: generic_out_of_scope
    allowed_output: conversation_only
    reason: >-
      Intake detected an out-of-scope case that does not have a more specific
      blocked roadmap candidate.

blocked_workflows:
  - id: annual_2025_entrepreneurs_roadmap
    workflow: annual_return
    tax_year: 2025
    status: blocked_pending_official_sources
    may_prepare_workpack: false
    profile_candidates:
      - annual_2025_entrepreneurs
    case_scope: complex_business_profit
    allowed_output: conversation_only
    reason: >-
      An eenmanszaak/ZZP now has full supported preparation in annual_2025: the
      reviewed zakelijke schema, the ordered profit chain through
      investeringsaftrek, ondernemersaftrek and MKB-winstvrijstelling to the
      belastbare winst, the Zorgverzekeringswet bijdrage, and a business field
      map that reaches review_ready when the schema is complete. Every other IB
      business form is recognised and routed rather than dead-ended. This
      blocked candidate now covers only the COMPUTATIONS that remain outside
      automated scope because they need taxpayer-specific balance-sheet history
      or a formal request: partnership profit-share allocation between vennoten,
      medegerechtigde loss caps, DGA/BV winst and corporate-tax interaction,
      agrarische ondernemingen (landbouwvrijstelling), zeevarenden, stakingswinst
      computation and the doorschuiffaciliteiten, herinvesteringsreserve and
      kostenegalisatiereserve movements, oudedagsreserve wind-down computation,
      and terbeschikkingstelling. The Belastingdienst itself describes the
      stakingswinst computation as very complicated and advises taking advice;
      the supported flow explains these positions and collects the facts, but
      does not compute them.
    unlock_condition: >-
      Add reviewed Belastingdienst/wetten.overheid.nl sources for per-vennoot
      profit allocation, the DGA/agrarisch/zeevarenden regimes, stakingswinst
      valuation and the doorschuiffaciliteiten, and the reserve movements; add
      per-partner field maps and the samenwerkingsverband screens; update
      knowledge snapshots and tests, then pass validation.

  - id: annual_2025_deceased_f_form_roadmap
    workflow: annual_return
    tax_year: 2025
    status: blocked_pending_official_sources
    may_prepare_workpack: false
    profile_candidates:
      - annual_2025_deceased_f_form
    case_scope: deceased_f_form
    allowed_output: conversation_only
    reason: >-
      Deceased-taxpayer F-form cases need dedicated official sources and are not
      covered by the active annual-return workflow.
    unlock_condition: >-
      Add reviewed F-form/deceased-taxpayer sources, local snapshots, field
      maps, and tests before enabling workpack preparation.

  - id: annual_2025_foreign_treaty_heavy_roadmap
    workflow: annual_return
    tax_year: 2025
    status: blocked_pending_official_sources
    may_prepare_workpack: false
    profile_candidates:
      - annual_2025_foreign_treaty_heavy
    case_scope: foreign_income_and_treaty_heavy
    allowed_output: conversation_only
    reason: >-
      Foreign-income and treaty-heavy cases need separate source coverage for
      treaty positions, double-tax relief, and cross-border evidence.
    unlock_condition: >-
      Add reviewed foreign-income and treaty sources, local snapshots, field
      maps, and validation tests before enabling workpack preparation.

  - id: annual_2027
    workflow: annual_return
    tax_year: 2027
    status: blocked_pending_official_sources
    may_prepare_workpack: false
    allowed_output: conversation_only
    reason: >-
      No reviewed annual-return 2027 source-register entries or local knowledge
      snapshots exist yet. Do not prepare a 2027 annual return workpack or
      substitute 2025 or 2026 values.
    unlock_condition: >-
      Add official Belastingdienst/wetten.overheid.nl 2027 annual sources,
      update the source register and knowledge snapshots, then pass validation.

  - id: provisional_2027
    workflow: provisional_assessment
    tax_year: 2027
    status: blocked_pending_official_sources
    may_prepare_workpack: false
    allowed_output: conversation_only
    reason: >-
      No reviewed provisional-assessment 2027 source-register entries or local
      knowledge snapshots exist yet. Do not prepare a 2027 provisional workpack
      or substitute 2026 provisional values.
    unlock_condition: >-
      Add official Belastingdienst 2027 provisional sources, update the source
      register and knowledge snapshots, then pass validation.

