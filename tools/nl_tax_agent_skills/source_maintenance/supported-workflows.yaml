version: 1
# last_reviewed is the most recent HUMAN attestation of this gate. The
# 2 October 2026 draft-scope change below was made by an agent and is recorded
# under pending_review; it does not move this date.
last_reviewed: "2026-08-15"

# Unattested change to this gate. A human reviewer who accepts the change sets
# human_review to the review date and moves last_reviewed at the same time.
pending_review:
  changed_on: "2026-10-02"
  changed_by: agent
  human_review: null
  scope: >-
    Added draft_only_workflows (vat_return, vat_correction, icp_declaration,
    oss_return and international_return for 2025 and 2026; annual_return
    2026). Removed the blocked entries annual_2026,
    annual_2025_nonresidents_c_form_roadmap and
    annual_2025_migration_m_form_roadmap, because the draft routes now cover
    those cases at draft readiness only.

policy:
  source_backed_only: true
  rule: >-
    A workflow is supported only when the exact workflow and tax year, plus any
    required shared all-year sources, have reviewed source-register entries,
    local knowledge snapshots, and passing validators. Never reuse rates,
    thresholds, field maps, or box 3 rules from another tax year. Entries under
    draft_only_workflows are staged, unreviewed preparation routes capped at
    draft readiness; they never satisfy this rule and never count as
    supported.

