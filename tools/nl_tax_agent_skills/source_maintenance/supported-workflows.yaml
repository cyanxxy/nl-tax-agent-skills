  - id: provisional_2026
    workflow: provisional_assessment
    tax_year: 2026
    status: active
    # The voorlopige aanslag asks an ondernemer for ONE figure: the estimated
    # winst BEFORE ondernemersaftrek and mkb-winstvrijstelling, excluding btw,
    # with a minus sign for a loss. It carries no balans and no
    # winst-en-verliesrekening, so this stays a single field. The separate
    # voorlopige aanslag Zorgverzekeringswet is raised with the taxpayer as a
    # companion item and is changed through its own route.
    business_scope: sourced_expected_profit_forecast_only
    business_field_id: onderneming.geschatte_winst
    profile_candidates:
      - provisional_2026_request
      - provisional_2026_change
      - provisional_2026_review
      - provisional_2026_stopzetten
    knowledge_dirs:
      - skills/_shared/knowledge/aow
      - skills/_shared/knowledge/laws
      - skills/_shared/knowledge/methods
      - skills/_shared/knowledge/own-home
      - skills/_shared/knowledge/partners
      - skills/_shared/knowledge/security
      - skills/_shared/knowledge/years/2026/provisional
      # The next two 2025 directories host all-year snapshots this workflow's
      # required sources point at (bd_box2_rates_2025_2026 and
      # bd_box2_income_ab_guidance under years/2025/box2, and the belastingrente
      # notes in years/2025/annual/late-filing.md). They are listed so every
      # required snapshot is reachable; the provisional workflow still uses only
      # 2026 provisional rates and never reuses 2025 annual rate sheets.
      - skills/_shared/knowledge/years/2025/box2
      - skills/_shared/knowledge/years/2025/annual
