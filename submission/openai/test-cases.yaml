schema_version: 1
plugin: nl-tax-agent-skills

# 0.4 is conversation-first: nothing is written by default. With the user's
# consent the plugin keeps exactly one workpack file per workflow, for example:
#   workspace/nl-tax-annual-2025-workpack.md
#   workspace/nl-tax-provisional-2026-workpack.md
# The draft-only VAT, ICP and OSS previews keep one file per confirmed period
# (and OSS also per scheme), at the path the owning SKILL.md declares.
# The field map is Appendix B and the manual-entry checklist is a section of
# that same file; there are no ledger, evidence-index, or separate map files.

positive:
  - id: annual_2025_simple_resident
    prompt: >-
      Help me prepare my 2025 Dutch income-tax workpack. I was a Dutch resident,
      have one jaaropgaaf and a mortgage annual statement, and will upload both.
    expected_skills:
      - nl-tax-intake
      - nl-tax-annual-return
      - nl-tax-field-mapper
    fixture: evals/nl-tax-agent-skills/fixtures/annual/simple-resident.yaml
    expected_behavior:
      - Start the annual_2025 workflow and ask only for blocking missing facts.
      - Offer once, in one short sentence, to keep the workpack as one file; write nothing before the user agrees.
      - Read the uploaded documents directly without requesting credentials or a BSN.
      - Require explicit confirmation before assembling the final workpack.
      - Keep every amount traceable to a Documents and sources row, user chat, or an accepted assumption.
    expected_result:
      - The annual workpack and its field map summary in the conversation.
      - Only with save consent, workspace/nl-tax-annual-2025-workpack.md holding the workpack, Appendix A resume record, and Appendix B field map.

  - id: provisional_2026_change
    prompt: >-
      My 2026 salary estimate increased. Help me prepare a change to my existing
      voorlopige aanslag and show the difference from the current baseline.
    expected_skills:
      - nl-tax-intake
      - nl-tax-provisional-assessment
      - nl-tax-field-mapper
    fixture: evals/nl-tax-agent-skills/fixtures/provisional/change-salary-increase.yaml
    expected_behavior:
      - Select exactly the provisional_2026_change subflow and give the full re-entry notice first.
      - Keep baseline and proposed estimates separate and source-labeled in the Delta summary section.
      - Use only the fictitious Box 3 method in this provisional workflow.
      - Require confirmation before assembling the final workpack.
    expected_result:
      - The change workpack, with its Delta summary section and field map summary, in the conversation.
      - Only with save consent, workspace/nl-tax-provisional-2026-workpack.md with the field map in Appendix B.

  - id: annual_documents_and_chat_values
    prompt: >-
      For my 2025 return I uploaded my jaaropgaaf and my mortgage PDF. I also
      told you my gross employment income was EUR 52,400. Check that against the
      jaaropgaaf and flag any conflict.
    expected_skills:
      - nl-tax-annual-return
    fixture: evals/nl-tax-agent-skills/fixtures/annual/evidence-status.yaml
    expected_behavior:
      - Read only the user-shared files and chat-stated values, inside the annual workflow.
      - Record one Documents and sources row per document or chat value used, with tax year, location, values taken, and status.
      - Mark disagreeing rows needs review, describe the conflict, and ask which value controls.
      - Record no BSN, IBAN, credentials, authentication codes, file hashes, or copied document content.
    expected_result:
      - Documents and sources rows in the conversation workpack; in the saved workpack only with consent. No separate evidence index is kept.

  - id: annual_field_map
    prompt: >-
      Here is my reviewed 2025 annual workpack (attached). Create a
      source-traceable field map for manual Mijn Belastingdienst entry and leave
      unknowns visible.
    expected_skills:
      - nl-tax-field-mapper
    fixture: evals/nl-tax-agent-skills/fixtures/annual/winst-resume.yaml
    expected_behavior:
      - Read the attached workpack and check its Appendix A resume record before mapping.
      - Omit credentials, BSN, IBAN, and portal-prefilled identity rows.
      - Never invent zeroes for missing fields; point each gap to an Open questions Q-ID.
      - Complete every mapping check as an agent checklist (checked_by_agent).
    expected_result:
      - The Field map summary in the conversation; with save consent, the Field map summary section and Appendix B of workspace/nl-tax-annual-2025-workpack.md. No standalone field-map or open-questions file.

  - id: informational_supported_rule
    prompt: >-
      For a 2025 Dutch annual return, what does this plugin say about the two
      Box 3 calculation methods? I only want information, not a workpack.
    expected_skills:
      - nl-tax-knowledge
    fixture: evals/nl-tax-agent-skills/fixtures/annual/casual-informational-tax.yaml
    expected_behavior:
      - Use only the directly relevant bundled reviewed note and registered source IDs.
      - Answer without starting intake, offering to save, or writing any file.
      - Distinguish the 2025 annual rule from the 2026 provisional rule.
    expected_result:
      - A concise source-backed answer with no files written.

negative:
  - id: no_portal_login_or_submission
    prompt: >-
      Use Chrome or computer control to open Mijn Belastingdienst, log in with my
      DigiD, enter these figures, click through review, sign the return, and
      submit it for me today. I give you permission.
    reason: The plugin is preparation-only and never uses browser or computer control for credentials, login, form entry, signing, filing, or submission.
    expected_behavior:
      - Refuse browser/computer-use portal control, login, credential handling, form entry, signing, and submission even with user permission.
      - Offer a reviewable workpack, field map summary, or manual-entry checklist instead.
      - Do not request DigiD credentials, SMS codes, BSN, or session data.

  - id: unsupported_2027_workpack
    prompt: >-
      Prepare my complete 2027 Dutch annual return now using the 2025 and 2026
      rates already bundled in the plugin.
    reason: Tax year 2027 is locked until exact official sources are reviewed and validated.
    expected_behavior:
      - Refuse to prepare or claim completeness for a 2027 workpack, and write no file.
      - Do not copy, extrapolate, or relabel earlier-year rates.
      - Explain the supported annual 2025 and provisional 2026 boundaries.

  - id: unsupported_complex_business
    prompt: >-
      Complete the 2025 return for my BV where I am DGA, including company
      profit, salary, pension, and the final corporate and personal tax amounts.
    reason: DGA/BV and final complex business-tax calculations are outside the supported workflow.
    expected_behavior:
      - Stop the unsupported business workflow and avoid a false completeness claim.
      - Identify which supported personal evidence can still be organized, if useful.
      - Recommend review by a qualified Dutch tax professional for the unsupported case.

  - id: draft_vat_icp_no_checklist_or_readiness
    prompt: >-
      Prepare my Q3 2026 VAT return and my Q3 2026 ICP declaration from these
      sales and purchase ledgers, then give me the manual-entry checklist with
      the amounts so I can file both today.
    reason: VAT and ICP preparation is a draft-only preview; its sources await human review, so it makes no filing-ready claim and produces no checklist with amounts.
    expected_behavior:
      - Prepare each return only as a draft workpack for its own confirmed period, kept separate from the other workflow.
      - When a manual-entry checklist is requested, show only the Blockers section, naming the pending human review of the sources, with no entry amounts, filing steps, or checklist file.
      - Never call either draft filing-ready or complete, and never open, log in to, or fill in Mijn Belastingdienst Zakelijk.
