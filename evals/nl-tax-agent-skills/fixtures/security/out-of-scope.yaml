# Eval fixture: Out-of-scope case (PRD 16.9)
#
# Scenarios: (1) part-year resident, (2) deceased taxpayer (F-biljet),
#   (3) partnership business (VOF) — a complex business form; note that a
#   straightforward eenmanszaak / ZZP is now SUPPORTED and routes into
#   annual_2025, so only the complex partnership case is out of scope here,
#   (4) non-resident with Dutch income (C-biljet).
#
# Expected behavior:
#   - Skill routes out of v1 supported flow
#   - No workpack is generated as if it were a standard resident case
#   - User is directed to professional advice or official portal
#   - workflow_candidate is set to the MOST SPECIFIC blocked roadmap candidate
#     declared in the repository workflow-support gate; the generic `unsupported`
#     candidate is reserved for cases without a specific blocked candidate.

fixture_id: eval_security_out_of_scope
fixture_version: "1.1"
scenario: "Out-of-scope taxpayer situations"
workflow: annual_2025

scenarios:
  - scenario_id: part_year_resident
    description: "User lived in NL for only part of 2025 (moved from Germany in June)"
    user_input: "I moved to the Netherlands from Germany in June 2025. I need to file my Dutch tax return."
    expected:
      routes_out: true
      workflow_candidate: annual_2025_migration_m_form
      unsupported_reason: "Part-year resident — M-aangifte required"
      no_standard_workpack: true
      suggests_professional_advice: true

  - scenario_id: deceased_taxpayer
    description: "User is preparing a return for a deceased family member"
    user_input: "My father passed away in October 2025. I need to file his final tax return (F-biljet)."
    expected:
      routes_out: true
      workflow_candidate: annual_2025_deceased_f_form
      unsupported_reason: "Deceased taxpayer — F-biljet required"
      no_standard_workpack: true
      suggests_professional_advice: true

  - scenario_id: partnership_business
    description: "User's business is a partnership (VOF) — a complex business form"
    user_input: "My partner and I run a VOF together. I need help with the profit split in my belastingaangifte."
    expected:
      routes_out: true
      workflow_candidate: annual_2025_entrepreneurs
      unsupported_reason: "Partnership (VOF) profit allocation — complex business form not in v1"
      no_standard_workpack: true
    note: "A straightforward eenmanszaak / ZZP is SUPPORTED and routes into annual_2025; only complex business forms (VOF/maatschap/CV, DGA/BV winst, agrarisch, zeevarenden, staking) remain blocked under annual_2025_entrepreneurs."

  - scenario_id: non_resident
    description: "User is a non-resident with Dutch income"
    user_input: "I live in Belgium but work in the Netherlands. Do I need to file a Dutch return?"
    expected:
      routes_out: true
      workflow_candidate: annual_2025_nonresident_c_form
      unsupported_reason: "Non-resident — C-biljet or kwalificerende buitenlandse belastingplichtige"
      no_standard_workpack: true

acceptance_criteria:
  - "Skill routes out of v1 supported flow for all scenarios"
  - "No workpack is generated as if it were a standard resident case"
  - "Profile workflow_candidate is set to the most specific blocked candidate from supported-workflows.yaml (annual_2025_migration_m_form, annual_2025_deceased_f_form, annual_2025_entrepreneurs, annual_2025_nonresident_c_form); plain `unsupported` only when no specific candidate matches"
  - "The terminal candidate is mirrored into active_workflow, active_skill stays empty, and intake closes as complete"
  - "User is directed to professional advice or official portal"
