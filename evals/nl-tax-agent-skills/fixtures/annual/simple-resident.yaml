# Eval fixture: Annual simple resident case (PRD 16.2)
#
# Scenario: Full-year Dutch resident, no fiscal partner, one employer,
#            savings account, no own home. The taxpayer agrees to keep the
#            workpack as a file when the workflow starts.

fixture_id: eval_annual_simple_resident
fixture_version: "2.0"
scenario: "Annual simple resident — single, employed, savings only, workpack saved with consent"
tax_year: 2025
workflow: annual_2025

taxpayer_profile:
  person:
    display_name: "Test Taxpayer A"
    date_of_birth_known: true
    aow_status_known: true  # under AOW age
  residency:
    full_year_nl_resident: true
    part_year_resident: false
  partner:
    has_fiscal_partner: false

evidence_files:
  - file: "jaaropgaaf-2025-employer1.pdf"
    evidence_type: jaaropgaaf
    tax_year: 2025
    extracted_fields:
      loon_loonheffing: 45000.00
      ingehouden_loonheffing: 12500.00
      premie_zvw: 2800.00
  - file: "jaaroverzicht-bank-2025.pdf"
    evidence_type: jaaroverzicht_bank
    tax_year: 2025
    extracted_fields:
      saldo_1_jan_2025: 72000.00
      saldo_31_dec_2025: 78000.00
      rente_ontvangen: 1200.00

saving:
  annual_2025:
    consent: given
    at: workflow_start

expected_outputs:
  files_created:
    - workspace/nl-tax-annual-2025-workpack.md
  files_not_created:
    - workspace/nl-tax-provisional-2026-workpack.md

  workpack_checks:
    - section: "Scope"
      contains: "2025"
      not_contains: "2026"
    - section: "Documents and sources"
      contains: "jaaropgaaf"
    - section: "Box 3 notes"
      contains: "fictitious"
      contains_also: "werkelijk rendement"  # annual supports both
    - section: "Not submission advice"
      present: true
    - section: "Human review checklist"
      present: true

  field_map_checks:   # Appendix B of the saved workpack
    - workflow: "annual_return"
    - tax_year: 2025

  negative_checks:
    - no_provisional_wording: true
    - no_credential_fields: true
    - no_login_automation: true

expected_resume_record:
  workflow: annual_2025
  tax_year: 2025
  save_consent: given
  generation_confirmed: true
  queued_workflow: null
  sections:
    box1: complete
    box3_peildatum: complete
    confirm: complete
  workpack_owner: nl-tax-annual-return
  field_map_owner: nl-tax-field-mapper

acceptance_criteria:
  - "The one annual workpack file is written after consent and holds every section, the resume record, and the field map"
  - "Each document used is a Documents and sources row; no separate evidence index exists"
  - "Box 3 annual path used (both fictitious and actual-return notes)"
  - "No provisional wording appears"
  - "No credential collection"
