# Eval fixture: Annual evidence status and year gating (Documents and sources rows)

fixture_id: eval_annual_evidence_status
fixture_version: "2.0"
scenario: "Annual 2025 income evidence — only one reviewed current-year document closes the gap"
tax_year: 2025
workflow: annual_2025

taxpayer_profile:
  residency:
    full_year_nl_resident: true
  partner:
    has_fiscal_partner: false

# The taxpayer shares three documents; the annual workflow reads them itself
# and records each one used as a `Documents and sources` row. There is no
# evidence index file any more.
shared_documents:
  - name: jaaropgaaf-2025-employer-a.pdf
    evidence_type: jaaropgaaf
    tax_year: 2025
    readable: true
    values:
      loon_loonheffing: 45000.00
      ingehouden_loonheffing: 12500.00
  - name: jaaropgaaf-2024-employer-a.pdf
    evidence_type: jaaropgaaf
    tax_year: 2024
    readable: true
    values:
      loon_loonheffing: 43000.00
      ingehouden_loonheffing: 11800.00
  - name: jaaropgaaf-2025-employer-b-scan.pdf
    evidence_type: jaaropgaaf
    tax_year: 2025
    readable: partially     # the loon figure is legible, the loonheffing is not
    values:
      loon_loonheffing: 9000.00

saving:
  annual_2025:
    consent: given
    at: workflow_start

expected_documents_rows:
  - document: jaaropgaaf-2025-employer-a.pdf
    tax_year: 2025
    status: extracted
    closes_2025_income_gap: true
  - document: jaaropgaaf-2024-employer-a.pdf
    tax_year: 2024
    status: extracted
    closes_2025_income_gap: false   # wrong tax year: context only, never a 2025 value
  - document: jaaropgaaf-2025-employer-b-scan.pdf
    tax_year: 2025
    status: needs review
    closes_2025_income_gap: false   # needs review until the taxpayer confirms it

expected_outputs:
  files_created:
    - workspace/nl-tax-annual-2025-workpack.md
  files_not_created:
    - workspace/nl-tax-provisional-2026-workpack.md

expected_resume_record:
  workflow: annual_2025
  tax_year: 2025
  save_consent: given
  readiness: draft
  sections:
    box1: deferred
  open_question_topics:
    - "confirm the employer B loonheffing from the original jaaropgaaf"

expected_state:
  eligible_document_count: 1
  eligible_documents:
    - jaaropgaaf-2025-employer-a.pdf
  excluded_documents:
    - jaaropgaaf-2024-employer-a.pdf
    - jaaropgaaf-2025-employer-b-scan.pdf
  decision_owner_is_agent: true

expected_behavior:
  - "The annual agent reads the shared documents directly and records each one used as a Documents and sources row"
  - "Only a reviewed, successfully extracted, correct-year document closes the 2025 income gap"
  - "The 2024 document never supplies a 2025 value; the unclear 2025 scan stays `needs review` with an open question"
  - "No evidence index file exists and no Python validator decides evidence completeness"

acceptance_criteria:
  - "Box 1 stays open (deferred) until the needs-review document is confirmed"
  - "Documents and sources shows tax year and status for every row"
  - "No file hashes and no copied document content beyond short provenance quotes"
