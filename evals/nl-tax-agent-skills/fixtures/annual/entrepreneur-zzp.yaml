# Eval fixture: Annual entrepreneur (eenmanszaak / ZZP)
#
# Scenario: Full-year Dutch resident, no fiscal partner, one eenmanszaak with
#            winst uit onderneming, meets the urencriterium, no own home.
#
# Expected behavior:
#   - Case is SUPPORTED and routes into annual_2025 (NOT out of scope)
#   - business.has_onderneming is set true; finalized profit-and-loss and balance
#     evidence is organized in Phase 2A via the nl-tax-winst helper
#   - The workpack walks the ordered chain: winst -> ondernemersaftrek ->
#     MKB-winstvrijstelling -> belastbare winst. No asset was bought in 2025, so
#     no investeringsaftrek screen is claimed and no schema blocker arises.
#   - The Zvw bijdrage is raised as a separate aanslag
#   - The field map mirrors the real aangifte rubrieken and reaches review_ready;
#     it never instructs the taxpayer to type a deduction the aangifte computes

fixture_id: eval_annual_entrepreneur_zzp
fixture_version: "1.0"
scenario: "Annual entrepreneur — eenmanszaak / ZZP with winst uit onderneming"
tax_year: 2025
workflow: annual_2025

taxpayer_profile:
  person:
    display_name: "Test Taxpayer E"
    date_of_birth_known: true
    aow_status_known: true  # under AOW age
  residency:
    full_year_nl_resident: true
    part_year_resident: false
  partner:
    has_fiscal_partner: false
  business:
    has_onderneming: true
    legal_form: eenmanszaak
    urencriterium_met: true
    starter_status: false

evidence_files:
  - file: "winst-verlies-rekening-2025.pdf"
    evidence_type: winst_verlies_rekening
    tax_year: 2025
    extracted_fields:
      omzet: 62000.00
      zakelijke_kosten: 14000.00
      winst_voor_ondernemersaftrek: 48000.00
  - file: "balans-2025.pdf"
    evidence_type: balans
    tax_year: 2025
    extracted_fields:
      activa_totaal: 24500.00
      passiva_totaal: 24500.00
      ondernemingsvermogen_begin: 20000.00
      ondernemingsvermogen_eind: 24500.00
  - file: "urenadministratie-2025.xlsx"
    evidence_type: urenadministratie
    tax_year: 2025
    extracted_fields:
      totaal_uren: 1600

expected_outputs:
  files_created:
    - workspace/taxpayer/profile.yaml
    - workspace/taxpayer/evidence-index.yaml
    - workspace/annual/2025/return-pack.md
    - workspace/annual/2025/field-map.yaml
    - workspace/shared/assumptions.md
    - workspace/shared/missing-info.md
    - workspace/shared/session-progress.yaml

  files_not_created:
    - workspace/provisional/**

  workpack_checks:
    - section: "Winst uit onderneming notes"
      present: true
      contains: "belastbare winst"
      contains_also: "MKB-winstvrijstelling"
    - section: "Scope"
      contains: "2025"
      not_contains: "2026"
    - section: "Not submission advice"
      present: true

  field_map_checks:
    - workflow: "annual_return"
    - tax_year: 2025
    - readiness: "review_ready"
    - has_no_blockers: true

  negative_checks:
    - no_provisional_wording: true
    - no_credential_fields: true
    - no_login_automation: true
    - routes_out: false   # eenmanszaak / ZZP is supported, not out of scope

expected_state:
  session_progress_version: "1.4"
  annual_2025_subsection: winst
  annual_2025_winst_status: complete
  field_map_readiness: review_ready
  field_map_blockers: []
  workpack_owner: nl-tax-annual-return
  field_map_owner: nl-tax-field-mapper

  # No S&O-verklaring, meewerkende partner, staking or investment claim: this is
  # the plain eenmanszaak case, which is the only shape that can reach
  # review_ready. A case touching an unestablished deduction screen stays draft.

acceptance_criteria:
  - "Case routes into annual_2025 (supported), not out of scope"
  - "The belastbare winst uit onderneming is derived through the ordered chain and feeds the box 1 total"
  - "The field map mirrors the aangifte rubrieken and reaches review_ready with no blocker"
  - "The field map never contains a deduction the aangifte computes itself"
  - "The Zvw bijdrage is surfaced as a separate aanslag"
  - "Stakingswinst, herinvesteringsreserve and terbeschikkingstelling stay manual review"
  - "No credential collection or login automation"
