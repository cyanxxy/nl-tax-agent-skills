    fixture: evals/nl-tax-agent-skills/fixtures/annual/stale-checklist-after-correction.yaml
    skill: nl-tax-annual-return
    purpose: >-
      Decline saving, generate, save later, correct a figure, request the
      checklist, and resume. The later save rebuilds the map from the recorded
      facts (A11); the correction marks the map and checklist STALE until
      regeneration (A10); the summary always equals Appendix B and a requested
      checklist never shows the old value (A12).
    expected_files:
