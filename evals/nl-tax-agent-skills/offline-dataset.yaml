          - "mobility scooter"
          - "home modification"
          - "gecombineerde heffing"
          - "1 May 2026"
          - "1 September 2026"
          - "14 July 2026"
        any:
          - ["another date", "andere datum"]
          - ["official form", "officieel formulier"]
          - ["no invitation", "geen uitnodiging"]
          - ["extension is unavailable", "geen uitstel"]

