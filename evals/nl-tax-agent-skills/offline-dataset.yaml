dataset_id: nl_tax_agent_skills_structural_contracts_v3
version: "3.0"
description: >
  Offline structural contract cases for NL Tax Agent Skills 0.4
  (conversation-first; docs/maintainers/0.4-conversation-first-design.md).
  Nothing is written by default; with the taxpayer's consent the plugin keeps
  exactly one workpack file per workflow. These fixtures protect hard file,
  resume-record, field-map, and source-ledger invariants; they are not live
  agent prompts, answer templates, or conversational scoring cases.

global:
  plugin_root: plugins/nl-tax-agent-skills
  generated_output_root: workspace
  # R3: the only files the plugin may write, and only after save consent.
  workpack_paths:
    annual_2025: workspace/nl-tax-annual-2025-workpack.md
    provisional_2026: workspace/nl-tax-provisional-2026-workpack.md
  # Harness captures (final response, a conversation-only workpack); never
  # plugin output.
  harness_output_globs:
    - workspace/eval/**
  # 0.3 ledger trees. 0.4 never writes them; a seeded copy must stay unchanged.
  legacy_forbidden_paths:
    - workspace/taxpayer/**
    - workspace/shared/**
    - workspace/annual/**
    - workspace/provisional/**
  forbidden_generated_output_regex:
    - "(?i)wachtwoord\\s*[:=]\\s*\\S+"
    - "(?i)password\\s*[:=]\\s*\\S+"

contract_default_cases:
  - annual_casual_informational_tax
  - annual_explicit_preparation
  - annual_winst_resume
  - annual_corrected_tax_behavior
  - annual_simple_resident
  - annual_then_provisional_request
  - annual_entrepreneur_zzp
  - provisional_entrepreneur_profit
  - annual_evidence_status
  - annual_partner_box3_actual
  - provisional_request_new_mortgage
  - provisional_change_salary_increase
  - provisional_stopzetten_refund
  - security_out_of_scope_part_year
  - annual_box2_dividend
  - annual_box2_share_sale
  - annual_partner_box2_allocation
  - provisional_box2_estimate
  - security_complex_box2_review
  - security_blocked_universal_roadmap_workflows
  - provisional_stopzetten_payment_redirect
  - security_source_staleness
  - annual_default_no_write
  - annual_save_on_request
  - provisional_resume_attached_workpack
  - annual_legacy_ledger_ignored
  - annual_reconfirm_unseen_figure
  - annual_stale_checklist_after_correction

cases:
  - id: annual_casual_informational_tax
    fixture: evals/nl-tax-agent-skills/fixtures/annual/casual-informational-tax.yaml
    skill: nl-tax-knowledge
    purpose: Answer a casual 2025 healthcare-cost question without starting intake or writing any file.
    expected_files:
      - workspace/eval/response.md

  - id: annual_explicit_preparation
    fixture: evals/nl-tax-agent-skills/fixtures/annual/explicit-preparation.yaml
    skill: nl-tax-intake
    purpose: Start annual preparation in the conversation, offer once to keep a workpack file, and write nothing before consent.
    expected_files:
      - workspace/eval/response.md

  - id: annual_winst_resume
    fixture: evals/nl-tax-agent-skills/fixtures/annual/winst-resume.yaml
    skill: nl-tax-annual-return
    purpose: Resume an attached saved workpack at the Winst section, keep it at the fixed path, and leave the attachment untouched.
    expected_files:
      - workspace/nl-tax-annual-2025-workpack.md
    workpacks:
      - path: workspace/nl-tax-annual-2025-workpack.md
        workflow: annual_2025
        field_map: not_yet_mapped
        readiness: draft
        generation_confirmed: false
        queued_workflow: null
        updated_after_created: true
        sections:
          filing_status: complete
          box1: chat_only
          winst: [complete, chat_only]
          box2: chat_only
          partner_allocation: chat_only
        documents:
          min_rows: 3
          document_contains_any:
            - winst-verlies-rekening
            - balans
    text_checks:
      - path: workspace/nl-tax-annual-2025-workpack.md
        appendix: A
        all:
          - 'created_at: "2026-09-18T19:02:00Z"'
        none:
          - "provisional_2026"

  - id: annual_corrected_tax_behavior
    fixture: evals/nl-tax-agent-skills/fixtures/annual/corrected-tax-behavior.yaml
    skill: nl-tax-knowledge
    purpose: Retrieve corrected healthcare exclusions, credit base, and conditional deadline branches without starting intake or writing any file.
    expected_files:
      - workspace/eval/response.md

  - id: annual_simple_resident
    fixture: evals/nl-tax-agent-skills/fixtures/annual/simple-resident.yaml
    skill: nl-tax-annual-return
    purpose: Annual 2025 happy path (one employer, savings, no partner) saved with consent and mapped.
    expected_files:
      - workspace/nl-tax-annual-2025-workpack.md
    workpacks:
      - path: workspace/nl-tax-annual-2025-workpack.md
        workflow: annual_2025
        field_map: expected
        generation_confirmed: true
        queued_workflow: null
        sections:
          box3_peildatum: [complete, chat_only]
          confirm: complete
    text_checks:
      - path: workspace/nl-tax-annual-2025-workpack.md
        appendix: B
        all:
          - "annual_return"
          - "2025"
          - "box1.loon"
        none:
          - "provisional_assessment"
          - "password"
          - "wachtwoord"

  - id: annual_then_provisional_request
    fixture: evals/nl-tax-agent-skills/fixtures/annual/dual-workflow-handoff.yaml
    skill: nl-tax-intake
    purpose: One request for both workflows keeps annual first, records the queued 2026 subflow, and keeps two separate consented files.
    expected_files:
      - workspace/nl-tax-annual-2025-workpack.md
      - workspace/nl-tax-provisional-2026-workpack.md
    workpacks:
      - path: workspace/nl-tax-annual-2025-workpack.md
        workflow: annual_2025
        field_map: expected
        generation_confirmed: true
        queued_workflow: null
      - path: workspace/nl-tax-provisional-2026-workpack.md
        workflow: provisional_2026_request
        field_map: expected
        generation_confirmed: true
        queued_workflow: null
    source_ledger_check:
      workpacks:
        - workspace/nl-tax-annual-2025-workpack.md
        - workspace/nl-tax-provisional-2026-workpack.md
    text_checks:
      - path: workspace/nl-tax-annual-2025-workpack.md
        appendix: B
        all:
          - "annual_return"
          - "2025"
        none:
          - "provisional_assessment"
      - path: workspace/nl-tax-provisional-2026-workpack.md
        appendix: B
        all:
          - "provisional_assessment"
          - "2026"
        none:
          - "workflow: annual_return"

