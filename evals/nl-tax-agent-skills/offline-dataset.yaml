      Include standard Box 2 dividend fields. Do not browse, log in, file, sign,
      submit, or ask for portal credentials.
      Write workspace/eval/current-case.txt containing exactly annual_box2_dividend.
    expected_files:
      - workspace/eval/current-case.txt
      - workspace/annual/2025/return-pack.md
      - workspace/annual/2025/field-map.yaml
    forbidden_files:
      - workspace/provisional/**
    text_checks:
      - path: workspace/annual/2025/field-map.yaml
