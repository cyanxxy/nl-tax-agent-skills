dataset_id: nl_tax_agent_skills_structural_contracts_v2
version: "2.0"
description: >
  Offline structural contract cases for NL Tax Agent Skills. These fixtures
  protect hard workflow and artifact invariants; they are not live agent
  prompts, answer templates, or conversational scoring cases.

global:
  plugin_root: plugins/nl-tax-agent-skills
  generated_output_root: workspace
  forbidden_generated_output_regex:
    - "(?i)wachtwoord\\s*[:=]\\s*\\S+"
    - "(?i)password\\s*[:=]\\s*\\S+"

contract_default_cases:
  - annual_casual_informational_tax
  - annual_explicit_preparation
  - annual_winst_resume
  - annual_corrected_tax_behavior
  - annual_simple_resident
  - annual_then_provisional_request
  - annual_entrepreneur_zzp
  - provisional_entrepreneur_profit
  - annual_evidence_status
  - annual_partner_box3_actual
  - provisional_request_new_mortgage
  - provisional_change_salary_increase
  - provisional_stopzetten_refund
  - security_out_of_scope_part_year
  - annual_box2_dividend
  - annual_box2_share_sale
  - annual_partner_box2_allocation
  - provisional_box2_estimate
  - security_complex_box2_review
  - security_blocked_universal_roadmap_workflows
  - provisional_stopzetten_payment_redirect
  - security_source_staleness

cases:
  - id: annual_casual_informational_tax
    fixture: evals/nl-tax-agent-skills/fixtures/annual/casual-informational-tax.yaml
    skill: nl-tax-intake
    purpose: Answer a casual 2025 healthcare-cost question without starting intake or a workpack.
    expected_files:
      - workspace/eval/response.md
    forbidden_files:
      - workspace/taxpayer/**
      - workspace/shared/session-progress.yaml
      - workspace/annual/**
      - workspace/provisional/**

  - id: annual_explicit_preparation
    fixture: evals/nl-tax-agent-skills/fixtures/annual/explicit-preparation.yaml
    skill: nl-tax-intake
    purpose: Start annual intake/workspace progression for an explicit preparation request with screening facts supplied.
    expected_files:
      - workspace/taxpayer/profile.yaml
      - workspace/shared/session-progress.yaml
    forbidden_files:
      - workspace/provisional/**
    text_checks:
      - path: workspace/taxpayer/profile.yaml
        all:
          - "annual_2025"
      - path: workspace/shared/session-progress.yaml
        all:
          - 'session_progress_version: "1.4"'
          - "nl-tax-annual-return"
          - "nl-tax-field-mapper"

  - id: annual_winst_resume
    fixture: evals/nl-tax-agent-skills/fixtures/annual/winst-resume.yaml
    skill: nl-tax-annual-return
    purpose: Resume the existing annual Winst subsection without resetting state or ownership.
    expected_files:
      - workspace/shared/session-progress.yaml
      - workspace/annual/2025/return-pack.md
      - workspace/annual/2025/field-map.yaml
    forbidden_files:
      - workspace/provisional/**
    text_checks:
      - path: workspace/shared/session-progress.yaml
        all:
          - 'session_progress_version: "1.4"'
          - "winst"
          - "nl-tax-annual-return"
          - "nl-tax-field-mapper"
      - path: workspace/annual/2025/field-map.yaml
        all:
          - "readiness: draft"
          - "business-section schema review"

  - id: annual_corrected_tax_behavior
    fixture: evals/nl-tax-agent-skills/fixtures/annual/corrected-tax-behavior.yaml
    skill: nl-tax-annual-return
    purpose: Retrieve corrected healthcare exclusions, credit base, and conditional deadline branches without starting intake.
    expected_files:
      - workspace/eval/response.md
    forbidden_files:
      - workspace/taxpayer/**
      - workspace/shared/session-progress.yaml
      - workspace/annual/**
      - workspace/provisional/**

  - id: annual_simple_resident
    fixture: evals/nl-tax-agent-skills/fixtures/annual/simple-resident.yaml
    skill: nl-tax-annual-return
    purpose: Annual 2025 happy path with one employer, savings, no partner.
    expected_files:
      - workspace/taxpayer/profile.yaml
      - workspace/annual/2025/return-pack.md
      - workspace/annual/2025/field-map.yaml
    forbidden_files:
      - workspace/provisional/**
    text_checks:
      - path: workspace/annual/2025/field-map.yaml
        all:
          - "annual_return"
          - "2025"
        none:
          - "password"
          - "wachtwoord"

  - id: annual_then_provisional_request
    fixture: evals/nl-tax-agent-skills/fixtures/annual/dual-workflow-handoff.yaml
    skill: nl-tax-intake
    purpose: Preserve one-owner annual-2025 to provisional-request-2026 sequencing from one natural-language request.
    expected_files:
      - workspace/taxpayer/profile.yaml
      - workspace/shared/session-progress.yaml
      - workspace/annual/2025/return-pack.md
      - workspace/annual/2025/field-map.yaml
      - workspace/provisional/2026/provisional-pack.md
      - workspace/provisional/2026/field-map.yaml
    source_ledger_check:
      session_path: workspace/shared/session-progress.yaml
      workpacks:
        - workflow: annual_2025
          path: workspace/annual/2025/return-pack.md
        - workflow: provisional_2026
          path: workspace/provisional/2026/provisional-pack.md
    text_checks:
      - path: workspace/annual/2025/field-map.yaml
        all:
          - "annual_return"
          - "2025"
        none:
          - "provisional_assessment"
      - path: workspace/provisional/2026/field-map.yaml
        all:
          - "provisional_assessment"
          - "2026"
        none:
          - "workflow: annual_return"

  - id: annual_entrepreneur_zzp
    fixture: evals/nl-tax-agent-skills/fixtures/annual/entrepreneur-zzp.yaml
    skill: nl-tax-annual-return
    purpose: Annual 2025 eenmanszaak / ZZP with the computed winst chain and a review-ready business field map.
    expected_files:
      - workspace/taxpayer/profile.yaml
      - workspace/annual/2025/return-pack.md
      - workspace/annual/2025/field-map.yaml
    forbidden_files:
      - workspace/provisional/**
    text_checks:
      - path: workspace/annual/2025/field-map.yaml
        all:
          - "annual_return"
          - "readiness: review_ready"
          - "onderneming.wv."
        none:
          - "onderneming.belastbare_winst"
          - "onderneming.zelfstandigenaftrek"
          - "onderneming.startersaftrek"
          - "onderneming.ondernemersaftrek_totaal"
          - "onderneming.mkb_winstvrijstelling"
          - "onderneming.kleinschaligheidsinvesteringsaftrek"
          - "password"
          - "wachtwoord"

  - id: provisional_entrepreneur_profit
    fixture: evals/nl-tax-agent-skills/fixtures/provisional/entrepreneur-profit.yaml
    skill: nl-tax-provisional-assessment
    purpose: Provisional 2026 sourced expected-profit forecast without annual business calculations.
    expected_files:
      - workspace/shared/session-progress.yaml
      - workspace/provisional/2026/provisional-pack.md
      - workspace/provisional/2026/field-map.yaml
    forbidden_files:
      - workspace/annual/**
    text_checks:
      - path: workspace/provisional/2026/field-map.yaml
        all:
          - "provisional_assessment"
          - "onderneming.geschatte_winst"
        none:
          - "zelfstandigenaftrek"
          - "MKB-winstvrijstelling"
          - "Zvw"
          - "final tax"
          - "box1.geschat_overig_inkomen"
          - "zvw."
          - "Zorgverzekeringswet"

  - id: annual_evidence_status
    fixture: evals/nl-tax-agent-skills/fixtures/annual/evidence-status.yaml
    skill: nl-tax-annual-return
    purpose: Annual 2025 evidence completeness counts only reviewed, successful, current-year evidence.
    expected_files:
      - workspace/shared/session-progress.yaml
      - workspace/annual/2025/return-pack.md
    forbidden_files:
      - workspace/provisional/**

  - id: annual_partner_box3_actual
    fixture: evals/nl-tax-agent-skills/fixtures/annual/partner-box3-actual.yaml
    skill: nl-tax-annual-return
    purpose: Annual 2025 partner case where actual return is more favorable than fictitious Box 3.
    expected_files:
      - workspace/annual/2025/return-pack.md
      - workspace/annual/2025/field-map.yaml
    forbidden_files:
      - workspace/provisional/**

  - id: provisional_request_new_mortgage
    fixture: evals/nl-tax-agent-skills/fixtures/provisional/request-new-mortgage.yaml
    skill: nl-tax-provisional-assessment
    purpose: Provisional 2026 request with estimates, mortgage interest, and fictitious-only Box 3.
    expected_files:
      - workspace/provisional/2026/provisional-pack.md
      - workspace/provisional/2026/field-map.yaml
    forbidden_files:
      - workspace/annual/**
    text_checks:
      - path: workspace/provisional/2026/field-map.yaml
        all:
          - "provisional_assessment"
          - "2026"
        none:
          - "werkelijk_rendement"
          - "actual_return"
          - "password"
          - "wachtwoord"

  - id: provisional_change_salary_increase
    fixture: evals/nl-tax-agent-skills/fixtures/provisional/change-salary-increase.yaml
    skill: nl-tax-provisional-assessment
    purpose: Provisional 2026 change where salary increased and all data must be re-entered.
    expected_files:
      - workspace/provisional/2026/provisional-pack.md
      - workspace/provisional/2026/field-map.yaml
      - workspace/provisional/2026/delta-summary.md
    forbidden_files:
      - workspace/annual/**
    text_checks:
      - path: workspace/provisional/2026/field-map.yaml
        none:
          - "werkelijk_rendement"
          - "actual_return"

  - id: provisional_stopzetten_refund
    fixture: evals/nl-tax-agent-skills/fixtures/provisional/stopzetten-refund.yaml
    skill: nl-tax-provisional-assessment
    purpose: Stopzetten guidance for a taxpayer receiving a monthly provisional refund.
    expected_files:
      - workspace/provisional/2026/provisional-pack.md

  - id: security_out_of_scope_part_year
    fixture: evals/nl-tax-agent-skills/fixtures/security/out-of-scope.yaml
    skill: nl-tax-intake
    purpose: Route a part-year resident out of the v1 standard-resident workflow.
    expected_files:
      - workspace/eval/response.md
    forbidden_files:
      - workspace/annual/**
      - workspace/provisional/**

  - id: annual_box2_dividend
    fixture: evals/nl-tax-agent-skills/fixtures/annual/box2-dividend.yaml
    skill: nl-tax-annual-return
    purpose: Annual 2025 standard Box 2 dividend preparation.
    expected_files:
      - workspace/annual/2025/return-pack.md
      - workspace/annual/2025/field-map.yaml
    forbidden_files:
      - workspace/provisional/**
    text_checks:
      - path: workspace/annual/2025/field-map.yaml
        all:
          - "box2.has_aanmerkelijk_belang"
          - "box2.reguliere_voordelen_bruto"
          - "box2.ingehouden_dividendbelasting"
        none:
          - "password"
          - "browser_session"

  - id: annual_box2_share_sale
    fixture: evals/nl-tax-agent-skills/fixtures/annual/box2-share-sale.yaml
    skill: nl-tax-annual-return
    purpose: Annual 2025 standard Box 2 share-sale preparation.
    expected_files:
      - workspace/annual/2025/return-pack.md
      - workspace/annual/2025/field-map.yaml
    forbidden_files:
      - workspace/provisional/**
    text_checks:
      - path: workspace/annual/2025/field-map.yaml
        all:
          - "box2.vervreemdingsprijs"
          - "box2.verkrijgingsprijs"
          - "box2.vervreemdingskosten"
          - "box2.vervreemdingsvoordeel"

  - id: annual_partner_box2_allocation
    fixture: evals/nl-tax-agent-skills/fixtures/annual/partner-box2-allocation.yaml
    skill: nl-tax-annual-return
    purpose: Annual 2025 fiscal-partner Box 2 allocation preparation.
    expected_files:
      - workspace/annual/2025/return-pack.md
      - workspace/annual/2025/field-map.yaml
    forbidden_files:
      - workspace/provisional/**

  - id: provisional_box2_estimate
    fixture: evals/nl-tax-agent-skills/fixtures/provisional/box2-estimate.yaml
    skill: nl-tax-provisional-assessment
    purpose: Provisional 2026 Box 2 estimated dividend preparation.
    expected_files:
      - workspace/provisional/2026/provisional-pack.md
      - workspace/provisional/2026/field-map.yaml
    forbidden_files:
      - workspace/annual/**
    text_checks:
      - path: workspace/provisional/2026/field-map.yaml
        all:
          - "box2.geschatte_reguliere_voordelen"
          - "box2.geschatte_ingehouden_dividendbelasting"
        none:
          - "werkelijk_rendement"
          - "actual_return"

  - id: security_complex_box2_review
    fixture: evals/nl-tax-agent-skills/fixtures/security/complex-box2-review.yaml
    skill: nl-tax-intake
    purpose: Route complex Box 2 facts to manual review or unsupported.
    expected_files:
      - workspace/eval/response.md
    forbidden_files:
      - workspace/annual/**
      - workspace/provisional/**

  - id: security_blocked_universal_roadmap_workflows
    fixture: evals/nl-tax-agent-skills/fixtures/security/blocked-universal-roadmap-workflows.yaml
    skill: nl-tax-intake
    purpose: Block inactive workflows outside active annual_2025 and provisional_2026 support.
    expected_files:
      - workspace/eval/response.md
    forbidden_files:
      - workspace/annual/**
      - workspace/provisional/**

  - id: provisional_stopzetten_payment_redirect
    fixture: evals/nl-tax-agent-skills/fixtures/provisional/stopzetten-payment-redirect.yaml
    skill: nl-tax-provisional-assessment
    purpose: Redirect a taxpayer who pays monthly from stopzetten to the complete-data change flow.
    expected_files:
      - workspace/provisional/2026/provisional-pack.md

  - id: security_source_staleness
    fixture: evals/nl-tax-agent-skills/fixtures/security/source-staleness.yaml
    skill: repository-source-maintenance
    purpose: Preserve the existing stale-source warning semantics without blocking workpack preparation.
    expected_files:
      - workspace/eval/response.md
