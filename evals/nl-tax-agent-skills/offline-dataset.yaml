dataset_id: nl_tax_agent_skills_offline_v1
version: "1.0"
description: >
  Offline benchmark cases for NL Tax Agent Skills. Cases reference local YAML
  fixtures only; model runs must not browse or fetch live tax sources.

global:
  plugin_root: plugins/nl-tax-agent-skills
  case_marker: workspace/eval/current-case.txt
  generated_output_root: workspace
  forbidden_generated_output_regex:
    - "(?i)wachtwoord\\s*[:=]\\s*\\S+"
    - "(?i)password\\s*[:=]\\s*\\S+"

benchmark_default_cases:
  - annual_simple_resident
  - provisional_request_new_mortgage
  - provisional_change_salary_increase
  - provisional_stopzetten_refund
  - security_out_of_scope_part_year

cases:
  - id: annual_simple_resident
    fixture: skills/_shared/eval-fixtures/annual/simple-resident.yaml
    skill: nl-tax-annual-return
    purpose: Annual 2025 happy path with one employer, savings, no partner.
    prompt: |
      Use the NL Tax Agent Skills plugin. Read the fixture at
      plugins/nl-tax-agent-skills/skills/_shared/eval-fixtures/annual/simple-resident.yaml.
      Prepare the annual 2025 local workpack from that offline fixture only.
      Do not browse, fetch live sources, log in, file, or ask for portal credentials.
      Write workspace/eval/current-case.txt containing exactly annual_simple_resident.
    expected_files:
      - workspace/eval/current-case.txt
      - workspace/taxpayer/profile.yaml
      - workspace/annual/2025/return-pack.md
      - workspace/annual/2025/field-map.yaml
    forbidden_files:
      - workspace/provisional/**
    text_checks:
      - path: workspace/annual/2025/return-pack.md
        all:
          - "2025"
        any:
          - ["fictitious", "forfaitair"]
          - ["werkelijk rendement", "actual return"]
        none:
          - "voorlopige aanslag"
      - path: workspace/annual/2025/field-map.yaml
        all:
          - "annual_return"
          - "2025"
        none:
          - "password"
          - "wachtwoord"

  - id: annual_entrepreneur_zzp
    fixture: skills/_shared/eval-fixtures/annual/entrepreneur-zzp.yaml
    skill: nl-tax-annual-return
    purpose: Annual 2025 eenmanszaak / ZZP with winst uit onderneming, ondernemersaftrek, and KIA.
    prompt: |
      Use the NL Tax Agent Skills plugin. Read the fixture at
      plugins/nl-tax-agent-skills/skills/_shared/eval-fixtures/annual/entrepreneur-zzp.yaml.
      Prepare the annual 2025 local workpack from that offline fixture only. The taxpayer
      has an eenmanszaak (ZZP) with winst uit onderneming — a supported case, not out of scope.
      Do not browse, fetch live sources, log in, file, or ask for portal credentials.
      Write workspace/eval/current-case.txt containing exactly annual_entrepreneur_zzp.
    expected_files:
      - workspace/eval/current-case.txt
      - workspace/taxpayer/profile.yaml
      - workspace/annual/2025/return-pack.md
      - workspace/annual/2025/field-map.yaml
    forbidden_files:
      - workspace/provisional/**
    text_checks:
      - path: workspace/annual/2025/return-pack.md
        all:
          - "2025"
        any:
          - ["winst uit onderneming", "zelfstandigenaftrek"]
          - ["MKB-winstvrijstelling", "ondernemersaftrek"]
        none:
          - "voorlopige aanslag"
      - path: workspace/annual/2025/field-map.yaml
        all:
          - "annual_return"
          - "onderneming."
        none:
          - "password"
          - "wachtwoord"

  - id: annual_partner_box3_actual
    fixture: skills/_shared/eval-fixtures/annual/partner-box3-actual.yaml
    skill: nl-tax-annual-return
    purpose: Annual 2025 partner case where actual return is more favorable than fictitious Box 3.
    prompt: |
      Use the NL Tax Agent Skills plugin. Read the fixture at
      plugins/nl-tax-agent-skills/skills/_shared/eval-fixtures/annual/partner-box3-actual.yaml.
      Prepare the annual 2025 partner workpack from that offline fixture only.
      Do not browse, fetch live sources, log in, file, or ask for portal credentials.
      Write workspace/eval/current-case.txt containing exactly annual_partner_box3_actual.
    expected_files:
      - workspace/eval/current-case.txt
      - workspace/annual/2025/return-pack.md
      - workspace/annual/2025/field-map.yaml
    forbidden_files:
      - workspace/provisional/**
    text_checks:
      - path: workspace/annual/2025/return-pack.md
        any:
          - ["allocation", "allocatie"]
          - ["fictitious", "forfaitair"]
          - ["werkelijk rendement", "actual return"]
        none:
          - "final official calculation"
          - "voorlopige aanslag"

  - id: provisional_request_new_mortgage
    fixture: skills/_shared/eval-fixtures/provisional/request-new-mortgage.yaml
    skill: nl-tax-provisional-assessment
    purpose: Provisional 2026 request with estimates, mortgage interest, and fictitious-only Box 3.
    prompt: |
      Use the NL Tax Agent Skills plugin. Read the fixture at
      plugins/nl-tax-agent-skills/skills/_shared/eval-fixtures/provisional/request-new-mortgage.yaml.
      Prepare the 2026 voorlopige aanslag request workpack from that offline fixture only.
      Do not browse, fetch live sources, log in, file, or ask for portal credentials.
      Write workspace/eval/current-case.txt containing exactly provisional_request_new_mortgage.
    expected_files:
      - workspace/eval/current-case.txt
      - workspace/provisional/2026/provisional-pack.md
      - workspace/provisional/2026/field-map.yaml
    forbidden_files:
      - workspace/annual/**
    text_checks:
      - path: workspace/provisional/2026/provisional-pack.md
        all:
          - "2026"
        any:
          - ["request", "aanvraag"]
          - ["estimate", "estimated", "schatting"]
          - ["fictitious", "forfaitair"]
        none:
          - "annual return"
      - path: workspace/provisional/2026/field-map.yaml
        all:
          - "provisional_assessment"
          - "2026"
        none:
          - "werkelijk_rendement"
          - "actual_return"
          - "password"
          - "wachtwoord"

  - id: provisional_change_salary_increase
    fixture: skills/_shared/eval-fixtures/provisional/change-salary-increase.yaml
    skill: nl-tax-provisional-assessment
    purpose: Provisional 2026 change where salary increased and all data must be re-entered.
    prompt: |
      Use the NL Tax Agent Skills plugin. Read the fixture at
      plugins/nl-tax-agent-skills/skills/_shared/eval-fixtures/provisional/change-salary-increase.yaml.
      Prepare the 2026 voorlopige aanslag change workpack from that offline fixture only.
      Include a delta summary and the reminder that the portal needs all data, not only changes.
      Do not browse, fetch live sources, log in, file, or ask for portal credentials.
      Write workspace/eval/current-case.txt containing exactly provisional_change_salary_increase.
    expected_files:
      - workspace/eval/current-case.txt
      - workspace/provisional/2026/provisional-pack.md
      - workspace/provisional/2026/field-map.yaml
      - workspace/provisional/2026/delta-summary.md
    forbidden_files:
      - workspace/annual/**
    text_checks:
      - path: workspace/provisional/2026/delta-summary.md
        all:
          - "baseline"
          - "current"
        any:
          - ["all data", "alle gegevens"]
          - ["10000", "10,000", "10.000"]
      - path: workspace/provisional/2026/field-map.yaml
        none:
          - "werkelijk_rendement"
          - "actual_return"

  - id: provisional_stopzetten_refund
    fixture: skills/_shared/eval-fixtures/provisional/stopzetten-refund.yaml
    skill: nl-tax-provisional-assessment
    purpose: Stopzetten guidance for a taxpayer receiving a monthly provisional refund.
    prompt: |
      Use the NL Tax Agent Skills plugin. Read the fixture at
      plugins/nl-tax-agent-skills/skills/_shared/eval-fixtures/provisional/stopzetten-refund.yaml.
      Prepare manual stopzetten guidance from that offline fixture only.
      Do not browse, fetch live sources, log in, file, calculate final tax, or ask for portal credentials.
      Write workspace/eval/current-case.txt containing exactly provisional_stopzetten_refund.
    expected_files:
      - workspace/eval/current-case.txt
      - workspace/provisional/2026/provisional-pack.md
    text_checks:
      - path: workspace/provisional/2026/provisional-pack.md
        all:
          - "stopzetten"
        any:
          - ["manual", "handmatig"]
          - ["official", "Mijn Belastingdienst"]
        none:
          - "final tax calculation"

  - id: security_out_of_scope_part_year
    fixture: skills/_shared/eval-fixtures/security/out-of-scope.yaml
    skill: nl-tax-intake
    purpose: Route a part-year resident out of the v1 standard-resident workflow.
    prompt: |
      Use the NL Tax Agent Skills plugin. Read the part_year_resident scenario in
      plugins/nl-tax-agent-skills/skills/_shared/eval-fixtures/security/out-of-scope.yaml.
      Handle the intake boundary only. Do not create a standard annual or provisional workpack.
      Write the boundary decision to workspace/eval/response.md.
      Write workspace/eval/current-case.txt containing exactly security_out_of_scope_part_year.
    expected_files:
      - workspace/eval/current-case.txt
      - workspace/eval/response.md
    forbidden_files:
      - workspace/annual/**
      - workspace/provisional/**
    text_checks:
      - path: workspace/eval/response.md
        any:
          - ["part-year", "part year", "part-year resident"]
          - ["unsupported", "out of scope", "not supported"]
          - ["M-aangifte", "C-biljet", "professional advice", "official portal"]

  - id: annual_box2_dividend
    fixture: skills/_shared/eval-fixtures/annual/box2-dividend.yaml
    skill: nl-tax-annual-return
    purpose: Annual 2025 standard Box 2 dividend preparation.
    prompt: |
      Use the NL Tax Agent Skills plugin. Read the fixture at
      plugins/nl-tax-agent-skills/skills/_shared/eval-fixtures/annual/box2-dividend.yaml.
