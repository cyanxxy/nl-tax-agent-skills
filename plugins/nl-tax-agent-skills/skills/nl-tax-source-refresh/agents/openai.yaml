# Codex per-skill configuration.
#
# Codex reads only `name` and `description` from SKILL.md; it ignores the Claude
# frontmatter keys `disable-model-invocation`, `user-invocable`, and
# `allowed-tools`. This file carries the equivalent invocation policy for Codex.
#
# nl-tax-source-refresh is a developer-only maintenance skill that refreshes and
# validates source snapshots. It must never be auto-invoked by the model.
# Explicit `$nl-tax-source-refresh` invocation still works.
policy:
  allow_implicit_invocation: false
