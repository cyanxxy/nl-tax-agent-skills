# Codex per-skill configuration.
#
# Codex indexes only name/description/path up front and loads the full SKILL.md
# when it selects a skill; it does NOT honor the Claude frontmatter keys
# (disable-model-invocation, user-invocable, allowed-tools), so this openai.yaml
# policy governs implicit invocation.
#
# nl-tax-box1-home is an INTERNAL helper, invoked only as a sub-step by
# nl-tax-annual-return or nl-tax-provisional-assessment — not a standalone user
# workflow. Disabling implicit invocation keeps Codex from routing a user prompt
# straight to it and bypassing the orchestrating workflow skill. Explicit
# `$nl-tax-box1-home` invocation still works.
interface:
  display_name: "Dutch Tax Box 1 Helper"
  short_description: "Internal Box 1 and own-home fact helper for supported workflows."

policy:
  allow_implicit_invocation: false
