# Codex per-skill configuration.
#
# Codex indexes only name/description/path up front and loads the full SKILL.md
# when it selects a skill; it does NOT honor the Claude frontmatter keys
# (disable-model-invocation, user-invocable, allowed-tools), so this openai.yaml
# policy governs implicit invocation.
#
# nl-tax-winst is an INTERNAL helper, invoked only as a sub-step by
# nl-tax-annual-return or nl-tax-provisional-assessment — not a standalone user
# workflow. Disabling implicit
# invocation keeps Codex from routing a user prompt straight to it and bypassing
# the orchestrating workflow skill. Explicit `$nl-tax-winst` invocation still
# works.
policy:
  allow_implicit_invocation: false
