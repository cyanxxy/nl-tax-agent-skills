taxpayer_profile_version: "1.2"
workspace_root: ""              # absolute path of the working folder; set once at intake, never changed
intake_status: "not_started"    # not_started | in_progress | complete
created_at: ""
updated_at: ""
workflow_candidate: ""
# Known terminal candidates include `manual_review` and the blocked candidates
# declared in `_shared/supported-workflows.yaml`; intake must not route those
# into annual/provisional workpack generation.

# Every fact below carries provenance:
#   source: file | user_chat | assumption | unknown
#   evidence_id: "ev_001"        # when source = file
#   quote: ""                    # when source = user_chat (verbatim user text)
#   stated_at: ""                # when source = user_chat (date)
#   assumption_id: "asn_001"     # when source = assumption

person:
  display_name:
    value: null
    source: "unknown"
  bsn_present: false
  bsn_storage: "not_stored"
  date_of_birth:
    value: null                  # ISO date YYYY-MM-DD; needed for AOW age and jonggehandicaptenkorting trigger
    source: "unknown"
  aow_age_in_tax_year:
    value: null                  # true | false; derived from date_of_birth and tax year, recorded for traceability
    source: "unknown"
    assumption_id: null          # required when source = assumption

residency:
  full_year_nl_resident:
    value: null
    source: "unknown"
  part_year_resident:
    value: null
    source: "unknown"
  unsupported_reason: null

partner:
  has_fiscal_partner:
    value: null
    source: "unknown"
  partner_bsn_present: false
  partner_date_of_birth:
    value: null                  # ISO date; required when has_fiscal_partner is true
    source: "unknown"
  partner_aow_age_in_tax_year:
    value: null
    source: "unknown"

household:
  # Children living at home as of 31 December of the tax year, used to screen
  # IACK and (when combined with partner status) alleenstaande-ouderenkorting
  # and other family-status credits. Collect only what is needed for credits
  # screening; do not store BSN.
  children_at_home_count:
    value: null                  # integer, 0 or more
    source: "unknown"
  children:
    # One entry per child counted above. Date of birth determines IACK
    # eligibility (child under 12 on 1 January of the tax year).
    []
  single_parent_status:
    value: null                  # true | false; relevant for alleenstaande-ouderenkorting eligibility
    source: "unknown"

workflows:
  annual_2025:
    requested: false
    status: "not_started"
  provisional_2026:
    requested: false
    subflow: null
    status: "not_started"

routing:
  complex_box2_screening:
    value: "not_screened"        # not_screened | standard | manual_review
    source: "unknown"
  blocked_profile_candidate:
    value: null                  # e.g. annual_2025_migration_m_form
    source: "unknown"

manual_review:
  required:
    value: false
    source: "unknown"
  reason: null
  triggers: []
  terminal: false

intake_anchor_question:
  asked: false
  answered: false
  question_id: ""
  answer:
    value: null
    source: "unknown"

notes:
  - "No BSN stored."
