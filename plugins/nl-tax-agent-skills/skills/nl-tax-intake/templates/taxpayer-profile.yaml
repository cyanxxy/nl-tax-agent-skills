taxpayer_profile_version: "1.4"
workspace_root: ""              # absolute path of the working folder; set once at intake, never changed
intake_status: "not_started"    # not_started | in_progress | complete
created_at: ""
updated_at: ""
workflow_candidate: ""
# Known terminal candidates include `manual_review` and the blocked candidates
# declared in the intake contract; intake must not route those
# into annual/provisional workpack generation.

# Every fact below carries provenance:
#   source: file | user_chat | calculated | assumption | unknown
#   evidence_id: "ev_001"        # when source = file
#   quote: ""                    # when source = user_chat (verbatim user text)
#   stated_at: ""                # when source = user_chat (date)
#   assumption_id: "asn_001"     # when source = assumption

person:
  display_name:
    value: null
    source: "unknown"
  date_of_birth:
    value: null                  # ISO date YYYY-MM-DD; needed for AOW age and jonggehandicaptenkorting trigger
    source: "unknown"
  # Keep AOW facts per tax year. Both entries may be needed when the user asks
  # for annual 2025 and provisional 2026 in the same workspace.
  aow_by_tax_year:
    "2025":
      status: {value: null, source: "unknown", calculated_from: []}  # below_all_year | reaches_during_year | aow_all_year
      transition_month: {value: null, source: "unknown", calculated_from: []}  # 1..12 only for reaches_during_year
      single_person_pension_entitlement: {value: null, source: "unknown"}  # true | false | unresolved; entitlement to an AOW pension for a single person, not single-parent status
    "2026":
      status: {value: null, source: "unknown", calculated_from: []}
      transition_month: {value: null, source: "unknown", calculated_from: []}
      single_person_pension_entitlement: {value: null, source: "unknown"}

residency:
  full_year_nl_resident:
    value: null
    source: "unknown"
  part_year_resident:
    value: null
    source: "unknown"
  unsupported_reason: null

partner:
  has_fiscal_partner:
    value: null
    source: "unknown"
  partner_date_of_birth:
    value: null                  # ISO date; required when has_fiscal_partner is true
    source: "unknown"
  aow_by_tax_year:
    "2025":
      status: {value: null, source: "unknown", calculated_from: []}
      transition_month: {value: null, source: "unknown", calculated_from: []}
      single_person_pension_entitlement: {value: null, source: "unknown"}
    "2026":
      status: {value: null, source: "unknown", calculated_from: []}
      transition_month: {value: null, source: "unknown", calculated_from: []}
      single_person_pension_entitlement: {value: null, source: "unknown"}

household:
  # Children living at home as of 31 December of the tax year, used to screen
  # IACK and other family-status questions. Children and single-parent status
  # do NOT establish alleenstaandeouderenkorting; that credit concerns a
  # single-person AOW pension entitlement. Collect only what is needed.
  children_at_home_count:
    value: null                  # integer, 0 or more
    source: "unknown"
  children:
    # One entry per child counted above. Date of birth determines IACK
    # eligibility (child under 12 on 1 January of the tax year).
    []
  single_parent_status:
    value: null                  # true | false; never use for alleenstaandeouderenkorting
    source: "unknown"

box2:
  # Answer to the intake question "Do you own 5% or more of a company
  # (a BV / aanmerkelijk belang)?". The annual workflow and field mapper
  # gate the Box 2 phases on this field. Complex-case screening lives in
  # routing.complex_box2_screening below.
  has_aanmerkelijk_belang:
    value: null                  # true | false
    source: "unknown"

business:
  # Winst uit onderneming (eenmanszaak / ZZP) has full supported preparation in
  # annual_2025, through to the belastbare winst uit onderneming. The annual
  # workflow gates the Winst uit onderneming phase (2A) on has_onderneming, the
  # way box2.has_aanmerkelijk_belang gates the Box 2 phase.
  # Every IB business form is now recognised and routed rather than dead-ended:
  # record the form and its facts here and keep preparing what it does not
  # block. Only the named computations stay terminal manual review, screened via
  # routing.complex_business_screening. The computation boundaries, and every
  # threshold, hour count, year count and amount behind the fields below, live
  # in the knowledge notes under
  # _shared/knowledge/years/2025/entrepreneur/ -- never restate them here.
  has_onderneming:
    value: null                  # true | false; false also covers a prepared
                                 # resultaat uit overige werkzaamheden, which is
                                 # a supported path and not a terminal route
    source: "unknown"
  legal_form:
    value: null                  # eenmanszaak | vof | maatschap | cv | bv | other
                                 # (eenmanszaak is the fully prepared form; the
                                 # rest are recognised and recorded, with only
                                 # the blocked computations routed to manual
                                 # review / the blocked candidate)
    source: "unknown"
  urencriterium_met:
    value: null                  # true | false; urencriterium per entrepreneur knowledge note -- gates zelfstandigenaftrek
    source: "unknown"
  starter_status:
    value: null                  # true | false; derived from startersaftrek conditions collected by the winst helper
    source: "unknown"
  so_verklaring:
    value: null                  # true | false; RVO S&O-verklaring held for the tax year
    source: "unknown"
  meewerkende_partner:
    value: null                  # true | false; the fiscale partner worked in the onderneming.
                                 # Hours, unpaid versus vergoeding, and the route between
                                 # meewerkaftrek, arbeidsbeloning, dienstbetrekking and
                                 # medeondernemerschap are collected by the winst helper
    source: "unknown"
  business_car:
    value: null                  # true | false; a car in the ondernemingsvermogen, or a private
                                 # car driven for business trips -- record which, since the two
                                 # are entered on different screens
    source: "unknown"
  werkruimte_thuis:
    value: null                  # true | false; a werkruimte in the taxpayer's own home is claimed
    source: "unknown"
  started_during_year:
    value: null                  # true | false; the onderneming started during the tax year
    source: "unknown"
  stopped_during_year:
    value: null                  # true | false; the onderneming stopped during the tax year.
                                 # The staking itself is recorded; the stakingswinst computation
                                 # stays manual review
    source: "unknown"
  has_business_loss:
    value: null                  # true | false; the year produced a business loss
    source: "unknown"
  bookkeeping_finalized:
    value: null                  # true | false; the bookkeeping and jaarstukken for the year are
                                 # final. Unfinalized books limit what can be prepared now;
                                 # never treat an unanswered item as a "no" or a zero
    source: "unknown"

workflows:
  # Status values: not_started | queued | in_progress | complete.
  # When both workflows are requested, annual_2025 is in_progress and
  # provisional_2026 is queued until the annual workpack and map validate.
  annual_2025:
    requested: false
    status: "not_started"
  provisional_2026:
    requested: false
    subflow: null
    status: "not_started"
    stopzetten_direction:
      value: null                # receiving_refund | paying_monthly; captured at intake.
                                 # A paying_monthly answer routes to the change subflow
                                 # (stopzetten applies only to refunds); the value is kept
                                 # here either way so the downstream skill sees it.
      source: "unknown"

routing:
  complex_box2_screening:
    value: "not_screened"        # not_screened | standard | manual_review
    source: "unknown"
  complex_business_screening:
    value: "not_screened"        # not_screened | standard | manual_review
    source: "unknown"
  blocked_profile_candidate:
    value: null                  # terminal candidate for unsupported whole cases; annual_2025_entrepreneurs is a nonterminal roadmap marker while annual_2025 stays active
    source: "unknown"

manual_review:
  required:
    value: false
    source: "unknown"
  reason: null
  triggers: []
  terminal: false

intake_anchor_question:
  asked: false
  answered: false
  question_id: ""
  answer:
    value: null
    source: "unknown"

notes: []
