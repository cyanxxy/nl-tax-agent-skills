# Codex per-skill configuration.
#
# Codex indexes only name/description/path up front and loads the full SKILL.md
# when it selects a skill; it does NOT honor the Claude frontmatter keys
# (disable-model-invocation, user-invocable, allowed-tools), so this openai.yaml
# policy governs implicit invocation.
#
# nl-tax-submit-companion is manual-only: it must never be auto-invoked by the
# model. The user (or an owning workflow) triggers it explicitly. Explicit
# `$nl-tax-submit-companion` invocation still works when implicit invocation is
# disabled.
interface:
  display_name: "Dutch Tax Manual-entry Checklist"
  short_description: "Explicit-only checklist from a reviewed workpack and field map."

policy:
  allow_implicit_invocation: false
