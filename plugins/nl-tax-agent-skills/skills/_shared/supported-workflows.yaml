    allowed_output: workspace/shared/missing-info.md
    reason: >-
      Migration M-form cases require separate official guidance and field maps
      and are not covered by the active resident annual-return workflow.
    unlock_condition: >-
      Add reviewed M-form sources, knowledge snapshots, field maps, and
      validation tests before enabling workpack preparation.

  - id: annual_2025_deceased_f_form_roadmap
    workflow: annual_return
    tax_year: 2025
    status: blocked_pending_official_sources
    may_prepare_workpack: false
    profile_candidates:
