policy:
  source_backed_only: true
  rule: >-
    A workflow is supported only when the exact workflow and tax year, plus any
    required shared all-year sources, have reviewed source-register entries,
    local knowledge snapshots, and passing validators. Never reuse rates,
    thresholds, field maps, or box 3 rules from another tax year.

