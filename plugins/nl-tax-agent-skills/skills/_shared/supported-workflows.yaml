terminal_workflows:
  - id: manual_review
    status: terminal_manual_review
    may_prepare_workpack: false
    profile_candidates:
      - manual_review
    case_scope: complex_case_manual_review
    allowed_output: workspace/shared/missing-info.md
    reason: >-
      Intake detected facts that should not enter an annual/provisional
      workpack automatically, such as complex Box 2 valuation, restructuring,
      treaty/nonresident, death, emigration, informal-capital, non-arm's-length,
      or corporate-tax-heavy DGA questions.

  - id: unsupported
    status: terminal_unsupported
    may_prepare_workpack: false
    profile_candidates:
      - unsupported
    case_scope: generic_out_of_scope
    allowed_output: workspace/shared/missing-info.md
    reason: >-
      Intake detected an out-of-scope case that does not have a more specific
      blocked roadmap candidate.

blocked_workflows:
  - id: annual_2025_entrepreneurs_roadmap
    workflow: annual_return
    tax_year: 2025
    status: blocked_pending_official_sources
    may_prepare_workpack: false
    profile_candidates:
      - annual_2025_entrepreneurs
    case_scope: complex_business_profit
    allowed_output: workspace/shared/missing-info.md
    reason: >-
      An eenmanszaak/ZZP has preparation-only support in annual_2025: finalized
      profit-and-loss and balance facts and questions, with the business field
      map kept draft. This blocked candidate covers complex forms/events and any
      final taxable-profit or completed-business-return work that still needs
      dedicated official sources, snapshots, field maps, and tests before a
      workpack can be prepared: partnerships (VOF, maatschap, CV) and their
      profit-share allocation, medegerechtigdheid, DGA/BV winst, agrarische
      ondernemingen (landbouwvrijstelling), zeevarenden, and complex-event
      calculations such as staking, herinvesteringsreserve, and oudedagsreserve
      wind-down. (The supported eenmanszaak flow still loads
      bd_oudedagsreserve_2025 to explain to the user that FOR build-up was
      abolished in 2023; only an actual reserve wind-down calculation is routed
      to manual review.)
    unlock_condition: >-
      Add reviewed Belastingdienst/wetten.overheid.nl sources for partnership
      profit allocation, DGA/agrarisch/zeevarenden regimes, and business-cessation
      events, update knowledge snapshots and field maps, then pass validation.

  - id: annual_2025_nonresidents_c_form_roadmap
    workflow: annual_return
    tax_year: 2025
    status: blocked_pending_official_sources
    may_prepare_workpack: false
    profile_candidates:
      - annual_2025_nonresident_c_form
    case_scope: nonresident_c_form
    allowed_output: workspace/shared/missing-info.md
    reason: >-
      Nonresident C-form cases are outside the reviewed resident annual-return
      source set and must not reuse resident-only assumptions.
    unlock_condition: >-
      Add official C-form/nonresident sources, local snapshots, field maps, and
      validation tests before enabling workpack preparation.

  - id: annual_2025_migration_m_form_roadmap
    workflow: annual_return
    tax_year: 2025
    status: blocked_pending_official_sources
