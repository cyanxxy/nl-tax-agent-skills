sources_loaded_by_workflow:
  annual_2025: []
  provisional_2026: []

# Each section/subsection status is one of:
# not_started | in_progress | complete | chat_only | deferred.
# `chat_only` means the user provided values in chat without uploading any file
# (an explicit choice, not a gap).
# A workflow's overall workpack-generation gate is satisfied only when every
# subsection is either `complete`, `chat_only`, or `deferred` (with deferred
# items recorded in workspace/shared/missing-info.md or as confirmed
# assumptions).

