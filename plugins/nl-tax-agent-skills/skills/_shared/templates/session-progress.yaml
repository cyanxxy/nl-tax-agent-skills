session_progress_version: "1.4"
workspace_root: ""          # absolute path of the working folder; set once at intake, never changed
created_at: ""
updated_at: ""
active_workflow: "unknown"  # exactly one current candidate; annual_2025 first when both workflows are requested
active_skill: ""            # exactly one owning workflow skill; a queued workflow is not active
last_question_asked: ""     # question_id of the most recent question posed to the user;
                            # update on every turn that asks a question (see
                            # _shared/knowledge/methods/interactive-elicitation.md)

# Backward-compatible mirror of the currently active workflow's source list.
# Owners update this together with sources_loaded_by_workflow; never combine
# annual and provisional IDs in this mirror.
