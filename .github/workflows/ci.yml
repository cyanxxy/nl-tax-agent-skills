name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Parse plugin and marketplace manifests
        run: |
          python -m json.tool plugins/nl-tax-agent-skills/.codex-plugin/plugin.json > /dev/null
          python -m json.tool plugins/nl-tax-agent-skills/.claude-plugin/plugin.json > /dev/null
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
          python -m json.tool .agents/plugins/marketplace.json > /dev/null
          test ! -e plugins/nl-tax-agent-skills/commands

      - name: Validate source register
        run: |
          python tools/nl_tax_agent_skills/source_maintenance/scripts/validate_source_register.py \
            plugins/nl-tax-agent-skills/skills/_shared/source-register.yaml

      - name: Validate knowledge pack
        run: |
          python tools/nl_tax_agent_skills/source_maintenance/scripts/validate_knowledge_pack.py \
            plugins/nl-tax-agent-skills/skills/_shared/source-register.yaml

      - name: Validate supported workflows
        run: |
          python tools/nl_tax_agent_skills/source_maintenance/scripts/validate_supported_workflows.py \
            tools/nl_tax_agent_skills/source_maintenance/supported-workflows.yaml \
            plugins/nl-tax-agent-skills/skills/_shared/source-register.yaml

      - name: Validate cross-host invocation policy
        run: |
          python tools/nl_tax_agent_skills/source_maintenance/scripts/validate_invocation_policy.py \
            plugins/nl-tax-agent-skills/skills

      - name: Compile-check every skill script
        run: |
          python -m compileall -q plugins/nl-tax-agent-skills/skills tools/nl_tax_agent_skills tests/nl_tax_agent_skills

      - name: Validate current release package and skill discovery
        run: |
          python -m unittest discover -s tests/nl_tax_agent_skills -p 'test_release_packaging.py'
          python -m unittest discover -s tests/nl_tax_agent_skills -p 'test_skill_discovery_and_loading.py'

      - name: Run unit tests from repository root
        run: |
          python -m unittest discover -s tests/nl_tax_agent_skills -p 'test_*.py'

      - name: Run unit tests from plugin directory (cwd-regression guard)
        working-directory: plugins/nl-tax-agent-skills
        run: |
          python -m unittest discover -s ../../tests/nl_tax_agent_skills -p 'test_*.py'

      - name: Verify offline structural contract dataset
        run: |
          python evals/nl-tax-agent-skills/verify_offline_workspace.py --check-dataset
