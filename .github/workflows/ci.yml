name: CI

# Official Anthropic plugin validator plus a JSON check of the Codex manifests.
# Offline, no API key, under a minute. Model behaviour is tested by
# plugin-eval.yml (manual, billed).

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install -g @anthropic-ai/claude-code@2.1.317

      - name: claude plugin validate
        run: |
          claude plugin validate --strict plugins/nl-tax-agent-skills
          claude plugin validate --strict .

      - name: Codex manifests are valid JSON
        run: jq empty plugins/nl-tax-agent-skills/.codex-plugin/plugin.json .agents/plugins/marketplace.json

      # A root plugin.json makes the Claude directory ignore the folder, and the
      # plugin must stay Markdown/YAML only.
      - name: Package rules
        run: |
          test ! -e plugins/nl-tax-agent-skills/plugin.json
          test -z "$(find plugins/nl-tax-agent-skills -type f \( -name '*.py' -o -name '*.sh' -o -name '*.js' -o -name '*.ts' \))"
