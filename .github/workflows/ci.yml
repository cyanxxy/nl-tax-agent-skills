name: CI

# Official Anthropic plugin validator plus a JSON check of the Codex manifests.
# Offline, no API key, under a minute. Model behaviour is tested by
# plugin-eval.yml (manual, billed).

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install -g @anthropic-ai/claude-code@2.1.317

      - name: claude plugin validate
        run: |
          claude plugin validate --strict plugins/nl-tax-agent-skills
          claude plugin validate --strict .

      - name: Codex manifests are valid JSON
        run: jq empty plugins/nl-tax-agent-skills/.codex-plugin/plugin.json .agents/plugins/marketplace.json

      # A root plugin.json makes the Claude directory ignore the folder, and the
      # plugin must stay Markdown/YAML only.
      - name: Package rules
        run: |
          test ! -e plugins/nl-tax-agent-skills/plugin.json
          # Eval cases live in evals/claude-plugin/, never in the shipped folder.
          test ! -e plugins/nl-tax-agent-skills/evals
          test -z "$(find plugins/nl-tax-agent-skills -type f \( -name '*.py' -o -name '*.sh' -o -name '*.js' -o -name '*.ts' \))"

      # The directory accepts allowed-tools beyond Read/Grep/Glob/LS only from
      # Verified organizations; it refused 0.5.2 for Edit and AskUserQuestion.
      - name: allowed-tools stay read-only
        run: |
          bad=$(grep -h '^allowed-tools:' plugins/nl-tax-agent-skills/skills/*/SKILL.md \
            | sed 's/^allowed-tools://' | tr ' ,' '\n\n' | grep -v -E '^(Read|Grep|Glob|LS)?$' || true)
          if [ -n "$bad" ]; then echo "::error::Disallowed allowed-tools entries: $bad"; exit 1; fi
          # A YAML-list form would slip past the one-line check above.
          if grep -q -E '^allowed-tools:[[:space:]]*$' plugins/nl-tax-agent-skills/skills/*/SKILL.md; then
            echo "::error::allowed-tools must be one space-separated line, not a YAML list"; exit 1
          fi

      # The release workflow publishes whatever version the manifests carry.
      - name: Versions agree
        run: |
          v=$(jq -r .version plugins/nl-tax-agent-skills/.claude-plugin/plugin.json)
          c=$(jq -r .version plugins/nl-tax-agent-skills/.codex-plugin/plugin.json)
          if [ "$v" != "$c" ]; then echo "::error::Manifest versions differ: Claude $v, Codex $c"; exit 1; fi
          v_re=${v//./\\.}
          stale=$(grep -rnE 'plugin_version: *"?[0-9]+\.[0-9]+\.[0-9]+' plugins/nl-tax-agent-skills/skills | grep -v "plugin_version: *\"\?$v_re\b" || true)
          if [ -n "$stale" ]; then echo "::error::plugin_version differs from manifest $v:"; echo "$stale"; exit 1; fi
          grep -q "^## \[$v_re\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no ## [$v] section"; exit 1; }
