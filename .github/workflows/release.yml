name: Release

# Every push to main publishes a GitHub release when the plugin manifests carry
# a version that has no vX.Y.Z tag yet. A merge without a version bump does
# nothing. The release creates the tag, attaches the Cowork and OpenAI ZIPs,
# and uses the matching CHANGELOG.md section as its notes and the title after
# the heading's date as its name.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check for an unreleased version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version and skip if already released
        id: version
        run: |
          claude_version=$(jq -r .version plugins/nl-tax-agent-skills/.claude-plugin/plugin.json)
          codex_version=$(jq -r .version plugins/nl-tax-agent-skills/.codex-plugin/plugin.json)
          if [ "$claude_version" != "$codex_version" ]; then
            echo "::error::Manifest versions differ: Claude $claude_version, Codex $codex_version"
            exit 1
          fi
          echo "version=$claude_version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$claude_version" > /dev/null; then
            echo "v$claude_version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # Same checks as CI, run read-only, so a red commit is never published.
  # Only when a release is due: the regular CI run already covers main.
  validate:
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub release
    needs: [check, validate]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Release notes from CHANGELOG.md
        run: |
          mkdir -p release
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release/notes.md
          if [ ! -s release/notes.md ]; then
            echo "::error::CHANGELOG.md has no ## [$VERSION] section"
            exit 1
          fi
          # Title from the heading "## [X.Y.Z] — YYYY-MM-DD — Short title";
          # without a title part the release is named "vX.Y.Z".
          title=$(awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { print; exit }' CHANGELOG.md \
            | sed -n 's/^## \[[^]]*\] — [0-9-]* — //p')
          if [ -n "$title" ]; then
            echo "v$VERSION — $title" > release/title.txt
          else
            echo "v$VERSION" > release/title.txt
          fi

      - name: Build release ZIPs
        run: |
          git archive --format=zip \
            -o "release/nl-tax-agent-skills-${VERSION}-cowork.zip" \
            "HEAD:plugins/nl-tax-agent-skills"
          python3 submission/openai/build_bundle.py \
            --zip-path "release/nl-tax-agent-skills-${VERSION}-openai.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$(cat release/title.txt)" \
            --notes-file release/notes.md \
            release/*.zip
