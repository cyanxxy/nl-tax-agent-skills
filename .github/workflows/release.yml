name: Release

# Every push to main publishes a GitHub release when the plugin manifests carry
# a version that has no vX.Y.Z tag yet. A merge without a version bump does
# nothing. The release creates the tag, attaches the Cowork and OpenAI ZIPs,
# and uses the matching CHANGELOG.md section as its notes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version and skip if already released
        id: version
        run: |
          claude_version=$(jq -r .version plugins/nl-tax-agent-skills/.claude-plugin/plugin.json)
          codex_version=$(jq -r .version plugins/nl-tax-agent-skills/.codex-plugin/plugin.json)
          if [ "$claude_version" != "$codex_version" ]; then
            echo "::error::Manifest versions differ: Claude $claude_version, Codex $codex_version"
            exit 1
          fi
          echo "version=$claude_version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$claude_version" > /dev/null; then
            echo "v$claude_version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: claude plugin validate
        if: steps.version.outputs.release == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.317
          claude plugin validate --strict plugins/nl-tax-agent-skills

      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release/notes.md
          if [ ! -s release/notes.md ]; then
            echo "::error::CHANGELOG.md has no ## [$VERSION] section"
            exit 1
          fi

      - name: Build release ZIPs
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git archive --format=zip \
            -o "release/nl-tax-agent-skills-${VERSION}-cowork.zip" \
            "HEAD:plugins/nl-tax-agent-skills"
          python3 submission/openai/build_bundle.py \
            --zip-path "release/nl-tax-agent-skills-${VERSION}-openai.zip"

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release/notes.md \
            release/*.zip
